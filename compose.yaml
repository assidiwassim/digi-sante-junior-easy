# Digi-Santé Junior Easy — environnement de développement
#
#   docker compose up -d --build     démarre l'application et MySQL
#   http://localhost:8081            l'application
#   127.0.0.1:3308                   MySQL, depuis la machine hôte

name: digisante-easy

services:
  app:
    build: .
    container_name: digisante_easy_app
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Dans le réseau Docker, MySQL s'appelle `database` (nom du service).
      DATABASE_URL: 'mysql://digisante:digisante@database:3306/digisante_easy?serverVersion=8.0.36&charset=utf8mb4'
    ports:
      - '8081:80'
    volumes:
      - ./:/app

  database:
    image: mysql:8.0.36
    container_name: digisante_easy_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: digisante_easy
      MYSQL_USER: digisante
      MYSQL_PASSWORD: digisante
      # Même fuseau que PHP : CURDATE() et « today » désignent le même jour.
      TZ: Europe/Paris
    ports:
      - '3308:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data:
