security:
    # Les mots de passe sont hachés avec l'algorithme recommandé par Symfony.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Les utilisateurs sont chargés depuis la table `users`.
    # UserRepository::loadUserByIdentifier() accepte l'email (parents, admin)
    # OU l'identifiant (enfants) : c'est pourquoi il n'y a pas de `property`.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Deux pages de connexion (/login et /connexion-enfant) envoient
            # leur formulaire à la même adresse : /login.
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # Après connexion, la page d'accueil redirige chacun vers son
                # espace selon son rôle (voir HomeController).
                default_target_path: app_home
                always_use_default_target_path: true

            logout:
                path: app_logout
                target: app_home

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 7 jours

    # Pas de hiérarchie de rôles : un admin n'est ni parent ni enfant.
    #
    # Seule la PREMIÈRE règle qui correspond à l'URL est appliquée.
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/parent, roles: ROLE_PARENT }
        - { path: ^/enfant, roles: ROLE_CHILD }

when@test:
    security:
        password_hashers:
            # En test, un hachage rapide suffit.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
